<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Nebula — Local AI</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="aurora" aria-hidden="true">
  <span class="aurora__blob aurora__blob--1"></span>
  <span class="aurora__blob aurora__blob--2"></span>
  <span class="aurora__blob aurora__blob--3"></span>
</div>

<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__head">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>
            <path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>
          </svg>
        </span>
        <span class="brand__text">
          <strong>Nebula</strong>
          <small>local inference</small>
        </span>
      </div>
      <button class="icon-btn sidebar__collapse" id="sidebar-collapse" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>

    <button class="new-chat" id="new-chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>New conversation</span>
      <kbd>Ctrl K</kbd>
    </button>

    <nav class="sessions" id="sessions" aria-label="Conversations"></nav>

    <div class="sidebar__foot">
      <div class="status" id="status" data-state="connecting">
        <span class="status__dot" aria-hidden="true"></span>
        <span class="status__text">Connecting to Ollama…</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn topbar__menu" id="sidebar-open" title="Open sidebar" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <div class="model-picker" id="model-picker">
        <button class="model-picker__trigger" id="model-trigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="model-picker__meta">
            <span class="model-picker__name" id="model-name">Loading…</span>
            <span class="model-picker__sub" id="model-sub">detecting models</span>
          </span>
          <svg class="model-picker__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="model-menu" id="model-menu" role="listbox" aria-label="Available models" hidden></div>
      </div>

      <div class="topbar__actions">
        <label class="switch" for="thinking-toggle" title="Show the model's reasoning process">
          <input type="checkbox" id="thinking-toggle">
          <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
          <span class="switch__label">Reasoning</span>
        </label>

        <button class="icon-btn" id="refresh-models" title="Rescan installed models" aria-label="Rescan installed models">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11a8 8 0 1 0-1.6 5.6"/><path d="M20 5v6h-6"/>
          </svg>
        </button>

        <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle colour theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="viewport" id="viewport">
      <div class="thread" id="thread" role="log" aria-live="polite" aria-relevant="additions"></div>

      <div class="welcome" id="welcome">
        <div class="welcome__orb" aria-hidden="true"></div>
        <h1 class="welcome__title">What are we building?</h1>
        <p class="welcome__sub">Running entirely on your machine. Nothing leaves this device.</p>
        <div class="welcome__grid" id="welcome-grid">
          <button class="prompt-card" data-prompt="Explain how a tokeniser splits text, using a concrete analogy.">
            <span class="prompt-card__icon">◆</span>
            <span><strong>Explain a concept</strong><small>Plain language, with an analogy</small></span>
          </button>
          <button class="prompt-card" data-prompt="Write a Python function that merges overlapping intervals. Include type hints, docstring, and three test cases.">
            <span class="prompt-card__icon">⌘</span>
            <span><strong>Write some code</strong><small>Typed, documented, with tests</small></span>
          </button>
          <button class="prompt-card" data-prompt="I have a bug where my FastAPI endpoint hangs intermittently. Help me debug it step by step.">
            <span class="prompt-card__icon">⚙</span>
            <span><strong>Debug something</strong><small>Reason through it with me</small></span>
          </button>
          <button class="prompt-card" data-prompt="Draft a concise release note for a new offline-first feature, in two bullet points and a single sentence.">
            <span class="prompt-card__icon">✎</span>
            <span><strong>Draft some writing</strong><small>Short, clear, on-brand</small></span>
          </button>
        </div>
      </div>

      <button class="scroll-cue" id="scroll-cue" hidden aria-label="Scroll to latest message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      </button>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <div class="composer__field">
          <textarea id="input" rows="1" placeholder="Send a message…" aria-label="Message"></textarea>
          <button type="button" class="composer__stop" id="stop-btn" hidden title="Stop generating" aria-label="Stop generating">
            <span class="stop-square"></span>
          </button>
          <button type="submit" class="composer__send" id="send-btn" disabled aria-label="Send message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
          </button>
        </div>
        <div class="composer__hint">
          <span><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</span>
          <span class="composer__privacy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            offline
          </span>
        </div>
      </form>
    </div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="toasts" id="toasts" aria-live="assertive"></div>

<template id="tpl-session">
  <div class="session" role="listitem">
    <button class="session__main">
      <span class="session__title"></span>
      <span class="session__meta"></span>
    </button>
    <button class="session__delete" title="Delete conversation" aria-label="Delete conversation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</template>

<script src="/static/app.js"></script>
</body>
</html>
